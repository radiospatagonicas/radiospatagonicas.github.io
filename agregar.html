<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Emisora - Radios Patagónicas</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 700px;
        }
        h1 { 
            color: #2c3e50; 
            text-align: center; 
            margin-top: 0;
        }
        .aviso {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 15px;
        }
        .iframe-container {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 8px;
        }
        iframe {
            width: 100%;
            height: 850px; /* Ajustá este valor si el formulario queda más largo o más corto */
            border: none;
        }
        .volver {
            text-align: center;
            margin-top: 25px;
        }
        .volver a {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
        }
        .volver a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📻 Sumá tu Emisora</h1>
        
        <div class="aviso">
            ⚠️ Importante: Para ser agregada, tu stream debe ser <strong>HTTPS</strong>.<br>
            La versión HTTP quedó obsoleta e insegura para los navegadores modernos.
        </div>

        <div class="iframe-container">
            <!-- Tu formulario de Google Forms embebido -->
            <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSf0TzNjOLHS6lBiLYy0ErzeXOZFn09i3WifI4XHLC8WuGAPVg/viewform?embedded=true" title="Formulario de registro de emisora">
                Cargando formulario…
            </iframe>
        </div>

        <div class="volver">
            <a href="index.html">← Volver al directorio de radios</a>
        </div>
    </div>

</body>
</html>
