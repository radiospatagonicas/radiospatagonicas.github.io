<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Emisora - Radios Patagónicas</title>
    <style>
        /* Reset y base moderna */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); /* Gradiente azul patagónico nocturno */
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Tarjeta principal con efecto "glass" sutil */
        .card {
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 720px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Encabezado de la tarjeta */
        .card-header {
            background: linear-gradient(90deg, #2563eb, #1d4ed8);
            color: white;
            padding: 24px 30px;
            text-align: center;
        }

        .card-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .card-body {
            padding: 30px;
        }

        /* Caja de aviso moderna */
        .alert {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            background-color: #fff7ed;
            border-left: 4px solid #f97316;
            color: #9a3412;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .alert-icon {
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        /* Contenedor del iframe con bordes suaves */
        .form-wrapper {
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            background-color: #f8fafc;
        }

        iframe {
            width: 100%;
            height: 900px; /* Ajustable según la longitud de tu formulario */
            border: none;
            display: block;
        }

        /* Botón de volver elegante */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 24px;
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .back-link:hover {
            color: #ffffff;
            transform: translateX(-4px);
        }

        /* Ajuste para móviles */
        @media (max-width: 640px) {
            body { padding: 16px; justify-content: flex-start; padding-top: 40px; }
            .card-header { padding: 20px; }
            .card-header h1 { font-size: 1.25rem; }
            .card-body { padding: 20px; }
            iframe { height: 1100px; } /* Más alto en móvil por el apilamiento */
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="card-header">
            <h1>📻 Sumá tu Emisora al Directorio</h1>
        </div>
        
        <div class="card-body">
            <div class="alert">
                <span class="alert-icon">⚠️</span>
                <div>
                    <strong>Requisito importante:</strong> Para ser agregada, la URL de tu stream debe comenzar con <strong>https://</strong>. 
                    Los navegadores modernos bloquean el contenido HTTP por seguridad.
                </div>
            </div>

            <div class="form-wrapper">
                <iframe 
                    src="https://docs.google.com/forms/d/e/1FAIpQLSf0TzNjOLHS6lBiLYy0ErzeXOZFn09i3WifI4XHLC8WuGAPVg/viewform?embedded=true" 
                    title="Formulario de registro de emisora">
                    Cargando formulario…
                </iframe>
            </div>

            <div style="text-align: center;">
                <a href="index.html" class="back-link">
                    ← Volver al directorio de radios
                </a>
            </div>
        </div>
    </div>

</body>
</html>
